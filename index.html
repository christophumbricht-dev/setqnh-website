<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QNH</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
@font-face { font-family: "Space Grotesk"; src: url(/assets/fonts/space-grotesk-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "IBM Plex Sans"; src: url(/assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
:root { --paper: #F6F4EF; --ink: #102A43; --muted: #52667a; --accent: #0B7285; --line: #d9d4c9; --card: #fbfaf7; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --paper: #0B1A28; --ink: #E6EDF3; --muted: #8AA1B8; --accent: #3BB3C4; --line: #22374b; --card: #10243a; } }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 18px/1.5 "IBM Plex Sans", system-ui, sans-serif; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
main { text-align: center; }
img { width: 72px; height: auto; }
h1 { font: 700 44px/1 "Space Grotesk", system-ui, sans-serif; letter-spacing: 0.04em; margin: 18px 0 14px; }
p { margin: 0; color: var(--muted); }
.login { margin: 56px auto 0; max-width: 320px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.login h2 { font: 700 15px/1.2 "Space Grotesk", system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 6px; }
.login p { font-size: 15px; }
.login a { display: inline-block; margin-top: 14px; background: var(--accent); color: #fff; text-decoration: none; font-size: 15px; padding: 8px 16px; border-radius: 6px; }
.login a:hover, .login a:focus-visible { filter: brightness(1.1); }
.login a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/assets/qnh-symbol.svg" alt="">
  <h1>QNH</h1>
  <p>Hier entsteht etwas. Bald mehr.</p>
  <section class="login" aria-labelledby="login-h">
    <h2 id="login-h">Briefing</h2>
    <p>Interner Bereich. Anmeldung mit einem Code per E-Mail.</p>
    <a href="https://setqnh-briefing.pages.dev/">Anmelden →</a>
  </section>
</main>
</body>
</html>
